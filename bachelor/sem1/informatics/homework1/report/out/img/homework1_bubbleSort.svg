<g fill="#000" stroke="none" font-family="'Times New Roman', 'Liberation Serif', 'Times New Roman', Times, serif" font-size="4.057">
<text x="73.028" y="9.339" text-anchor="middle">Начало</text>
<text x="73.028" y="25.506" text-anchor="middle">for (int end = static_cast&lt;int&gt;(a.size()) -</text>
<text x="73.028" y="30.172" text-anchor="middle">1; end &gt; <tspan font-family='Consolas'>0</tspan>; --end)</text>
<text x="73.028" y="46.339" text-anchor="middle">bool changed = false;</text>
<text x="73.028" y="62.339" text-anchor="middle">for (int j = <tspan font-family='Consolas'>0</tspan>; j &lt; end; ++j)</text>
<text x="73.028" y="78.339" text-anchor="middle">if (a[j] &gt; a[j + 1])</text>
<text x="35.5" y="94.506" text-anchor="middle">std::swap(a[j], a[j + 1]);</text>
<text x="35.5" y="99.172" text-anchor="middle">changed = true;</text>
<text x="39.028" y="75.539" text-anchor="end">1</text>
<text x="107.028" y="75.539" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="74.528" y="70.839" text-anchor="start">1</text>
<text x="99.528" y="59.539" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="73.028" y="130.339" text-anchor="middle">if (!changed)</text>
<text x="45.5" y="146.339" text-anchor="middle">break;</text>
<text x="45.5" y="161.339" text-anchor="middle">1</text>
<text x="49.028" y="127.539" text-anchor="end">1</text>
