<g fill="#000" stroke="none" font-family="'Times New Roman', 'Liberation Serif', 'Times New Roman', Times, serif" font-size="4.057">
<text x="53.5" y="9.339" text-anchor="middle">Начало</text>
<text x="53.5" y="25.339" text-anchor="middle">for (int i = 1; i &lt; static_cast&lt;int&gt;(a.size()); ++i)</text>
<text x="53.5" y="41.506" text-anchor="middle">int key = a[i];</text>
<text x="53.5" y="46.172" text-anchor="middle">int j = i;</text>
<text x="53.5" y="62.506" text-anchor="middle">while (j &gt; <tspan font-family='Consolas'>0</tspan> &amp;&amp;</text>
<text x="53.5" y="67.172" text-anchor="middle">a[j - 1] &gt; key)</text>
<text x="53.5" y="83.506" text-anchor="middle">a[j] = a[j - 1];</text>
<text x="53.5" y="88.172" text-anchor="middle">--j;</text>
<text x="55" y="75.839" text-anchor="start">1</text>
<text x="72.5" y="62.039" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="53.5" y="113.339" text-anchor="middle">a[j] = key;</text>
<text x="55" y="33.839" text-anchor="start">1</text>
<text x="97.5" y="22.539" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="53.5" y="138.339" text-anchor="middle">Конец</text>
