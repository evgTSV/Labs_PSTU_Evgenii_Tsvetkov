<g fill="#000" stroke="none" font-family="'Times New Roman', 'Liberation Serif', 'Times New Roman', Times, serif" font-size="4.057">
<text x="68.028" y="9.339" text-anchor="middle">Начало</text>
<text x="68.028" y="25.506" text-anchor="middle">int n = static_cast&lt;</text>
<text x="68.028" y="30.172" text-anchor="middle">int&gt;(a.size());</text>
<text x="68.028" y="46.339" text-anchor="middle">for (int i = <tspan font-family='Consolas'>0</tspan>; i &lt; n - 1; ++i)</text>
<text x="68.028" y="62.339" text-anchor="middle">int smallest = i;</text>
<text x="68.028" y="78.339" text-anchor="middle">for (int j = i + 1; j &lt; n; ++j)</text>
<text x="68.028" y="94.339" text-anchor="middle">if (a[j] &lt; a[smallest])</text>
<text x="25.5" y="110.339" text-anchor="middle">smallest = j;</text>
<text x="29.028" y="91.539" text-anchor="end">1</text>
<text x="107.028" y="91.539" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="69.528" y="86.839" text-anchor="start">1</text>
<text x="94.528" y="75.539" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="68.028" y="141.339" text-anchor="middle">if (smallest != i)</text>
<text x="35.5" y="157.339" text-anchor="middle">std::swap(a[i], a[smallest]);</text>
<text x="39.028" y="138.539" text-anchor="end">1</text>
<text x="97.028" y="138.539" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
