<text x="68.028" y="25.339" text-anchor="middle">if (count == <tspan font-family='Consolas'>0</tspan>)</text>
<text x="35.5" y="41.339" text-anchor="middle">std::cout &lt;&lt; &quot;(empty array)\n&quot;;</text>
