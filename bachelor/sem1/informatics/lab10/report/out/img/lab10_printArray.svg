<text x="68.028" y="63.339" text-anchor="middle">for (int i = <tspan font-family='Consolas'>0</tspan>; i &lt; count; ++i)</text>
<text x="68.028" y="79.506" text-anchor="middle">std::cout &lt;&lt; i + 1 &lt;&lt; &quot;.</text>
<text x="68.028" y="84.172" text-anchor="middle">&quot; &lt;&lt; array[i] &lt;&lt; '\n';</text>
