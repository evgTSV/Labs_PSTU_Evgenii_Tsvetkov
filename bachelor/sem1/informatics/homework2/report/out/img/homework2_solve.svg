<text x="40.5" y="9.339" text-anchor="middle">Начало</text>
<text x="40.5" y="25.339" text-anchor="middle">if (n == <tspan font-family='Consolas'>0</tspan>)</text>
<text x="17.972" y="41.339" text-anchor="middle">return;</text>
<text x="21.5" y="22.539" text-anchor="end">1</text>
<text x="59.5" y="22.539" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="40.5" y="63.506" text-anchor="middle">solve(n - 1, from, spare, to,</text>
<text x="40.5" y="68.172" text-anchor="middle">towers, height, step);</text>
<text x="40.5" y="84.841" text-anchor="middle">int disk = towers[from].back();</text>
<text x="40.5" y="89.506" text-anchor="middle">towers[from].pop_back();</text>
<text x="40.5" y="94.172" text-anchor="middle">towers[to].push_back(disk);</text>
<text x="40.5" y="98.837" text-anchor="middle">++step;</text>
<text x="40.5" y="115.673" text-anchor="middle">std::cout &lt;&lt; &quot;Move &quot; &lt;&lt; step &lt;&lt; &quot;: disk &quot;</text>
<text x="40.5" y="120.339" text-anchor="middle">&lt;&lt; disk &lt;&lt; &quot;, &quot; &lt;&lt; &quot;ABC&quot;[from] &lt;&lt; &quot; -&gt; &quot;</text>
<text x="40.5" y="125.004" text-anchor="middle">&lt;&lt; &quot;ABC&quot;[to] &lt;&lt; '\n';</text>
<text x="40.5" y="141.339" text-anchor="middle">draw(towers, height);</text>
<text x="40.5" y="157.506" text-anchor="middle">solve(n - 1, spare, to, from,</text>
<text x="40.5" y="162.172" text-anchor="middle">towers, height, step);</text>
