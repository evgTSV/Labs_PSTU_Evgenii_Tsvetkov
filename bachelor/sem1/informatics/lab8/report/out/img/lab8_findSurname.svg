<text x="40.5" y="9.339" text-anchor="middle">Начало</text>
<text x="38.7" y="17.339" text-anchor="end">{</text>
<text x="40.5" y="25.506" text-anchor="middle">const auto matches = [&amp;](const Student&amp; s)</text>
<text x="40.5" y="30.172" text-anchor="middle">{ return surname == s.surname; };</text>
<text x="40.5" y="46.506" text-anchor="middle">return std::find_if(students.begin(),</text>
<text x="40.5" y="51.172" text-anchor="middle">students.end(), matches);</text>
<text x="38.7" y="59.339" text-anchor="end">}</text>
