<g fill="#000" stroke="none" font-family="'Times New Roman', 'Liberation Serif', 'Times New Roman', Times, serif" font-size="4.057">
<text x="63.028" y="9.339" text-anchor="middle">Начало</text>
<text x="61.228" y="17.339" text-anchor="end">{</text>
<text x="63.028" y="41.342" text-anchor="middle">if (date.size() != 1<tspan font-family='Consolas'>0</tspan> ||</text>
<text x="63.028" y="46.008" text-anchor="middle">date[4] != '-' || date[7] != '-'</text>
<text x="63.028" y="50.673" text-anchor="middle">|| date.find_first_not_of(</text>
<text x="63.028" y="55.339" text-anchor="middle">&quot;<tspan font-family='Consolas'>0</tspan>123456789-&quot;) !=</text>
<text x="63.028" y="60.004" text-anchor="middle">std::string::npos ||</text>
<text x="63.028" y="64.67" text-anchor="middle">std::count(date.begin(),</text>
<text x="63.028" y="69.335" text-anchor="middle">date.end(), '-') != 2)</text>
<text x="15.5" y="101.339" text-anchor="middle">return false;</text>
<text x="19.028" y="52.539" text-anchor="end">1</text>
<text x="107.028" y="52.539" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="63.028" y="123.673" text-anchor="middle">using namespace std::chrono;</text>
<text x="63.028" y="128.339" text-anchor="middle">const int y = std::stoi(date.substr(<tspan font-family='Consolas'>0</tspan>, 4));</text>
<text x="63.028" y="133.004" text-anchor="middle">const unsigned m = std::stoi(date.substr(5, 2));</text>
<text x="63.028" y="149.506" text-anchor="middle">const unsigned d =</text>
<text x="63.028" y="154.172" text-anchor="middle">std::stoi(date.substr(8, 2));</text>
<text x="63.028" y="170.673" text-anchor="middle">return y &gt; <tspan font-family='Consolas'>0</tspan> &amp;&amp;</text>
<text x="63.028" y="175.339" text-anchor="middle">year_month_day(year(y),</text>
<text x="63.028" y="180.004" text-anchor="middle">month(m), day(d)).ok();</text>
<text x="61.228" y="188.339" text-anchor="end">}</text>
<text x="63.028" y="196.339" text-anchor="middle">Конец</text>
