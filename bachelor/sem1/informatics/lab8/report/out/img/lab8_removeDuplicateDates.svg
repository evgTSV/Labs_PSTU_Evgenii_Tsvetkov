<g fill="#000" stroke="none" font-family="'Times New Roman', 'Liberation Serif', 'Times New Roman', Times, serif" font-size="4.057">
<text x="78.028" y="9.339" text-anchor="middle">Начало</text>
<text x="76.228" y="17.339" text-anchor="end">{</text>
<text x="78.028" y="25.339" text-anchor="middle">const auto students = readFile();</text>
<text x="78.028" y="41.339" text-anchor="middle">std::vector&lt;Student&gt; remaining;</text>
<text x="78.028" y="57.506" text-anchor="middle">for (const Student&amp;</text>
<text x="78.028" y="62.172" text-anchor="middle">student : students)</text>
<text x="78.028" y="81.006" text-anchor="middle">if (!hasDuplicateDate(</text>
<text x="78.028" y="85.672" text-anchor="middle">students, student))</text>
<text x="35.5" y="104.339" text-anchor="middle">remaining.push_back(student);</text>
<text x="39.028" y="80.539" text-anchor="end">1</text>
<text x="117.028" y="80.539" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="79.528" y="70.839" text-anchor="start">1</text>
<text x="99.528" y="57.039" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="78.028" y="135.339" text-anchor="middle">writeFile(remaining);</text>
<text x="78.028" y="151.506" text-anchor="middle">return students.size() -</text>
<text x="78.028" y="156.172" text-anchor="middle">remaining.size();</text>
<text x="76.228" y="164.339" text-anchor="end">}</text>
<text x="78.028" y="172.339" text-anchor="middle">Конец</text>
