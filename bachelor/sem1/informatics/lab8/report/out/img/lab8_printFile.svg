<g fill="#000" stroke="none" font-family="'Times New Roman', 'Liberation Serif', 'Times New Roman', Times, serif" font-size="4.057">
<text x="73.028" y="9.339" text-anchor="middle">Начало</text>
<text x="71.228" y="17.339" text-anchor="end">{</text>
<text x="73.028" y="25.506" text-anchor="middle">std::cout &lt;&lt; '\n'</text>
<text x="73.028" y="30.172" text-anchor="middle">&lt;&lt; title &lt;&lt; '\n';</text>
<text x="73.028" y="46.339" text-anchor="middle">const auto students = readFile();</text>
<text x="73.028" y="62.339" text-anchor="middle">if (students.empty())</text>
<text x="30.5" y="78.339" text-anchor="middle">std::cout &lt;&lt; &quot;(empty file)\n&quot;;</text>
<text x="34.028" y="59.539" text-anchor="end">1</text>
<text x="112.028" y="59.539" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="73.028" y="100.506" text-anchor="middle">for (std::size_t i = <tspan font-family='Consolas'>0</tspan>; i</text>
<text x="73.028" y="105.172" text-anchor="middle">&lt; students.size(); ++i)</text>
<text x="73.028" y="121.339" text-anchor="middle">const Student&amp; s = students[i];</text>
<text x="73.028" y="137.841" text-anchor="middle">std::cout &lt;&lt; i + 1 &lt;&lt; &quot;. &quot; &lt;&lt; s.surname &lt;&lt;</text>
<text x="73.028" y="142.506" text-anchor="middle">' ' &lt;&lt; s.name &lt;&lt; ' ' &lt;&lt; s.patronymic &lt;&lt; &quot; |</text>
<text x="73.028" y="147.172" text-anchor="middle">&quot; &lt;&lt; s.birthDate &lt;&lt; &quot; | &quot; &lt;&lt; s.address &lt;&lt; &quot;</text>
<text x="73.028" y="151.837" text-anchor="middle">| &quot; &lt;&lt; s.rating &lt;&lt; '\n';</text>
<text x="71.228" y="113.339" text-anchor="end">{</text>
<text x="71.228" y="160.339" text-anchor="end">}</text>
<text x="74.528" y="113.839" text-anchor="start">1</text>
<text x="97.028" y="100.039" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="71.228" y="169.339" text-anchor="end">}</text>
