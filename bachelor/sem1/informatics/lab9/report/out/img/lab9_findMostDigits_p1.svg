<text x="76.228" y="17.339" text-anchor="end">{</text>
<text x="78.028" y="25.506" text-anchor="middle">WordResult best;</text>
<text x="78.028" y="30.172" text-anchor="middle">std::size_t number = <tspan font-family='Consolas'>0</tspan>;</text>
<text x="78.028" y="46.506" text-anchor="middle">for (const std::string&amp; line :</text>
<text x="78.028" y="51.172" text-anchor="middle">readLines(DESTINATION))</text>
<text x="78.028" y="67.506" text-anchor="middle">for (const auto word</text>
<text x="78.028" y="72.172" text-anchor="middle">: splitWords(line))</text>
<text x="78.028" y="86.675" text-anchor="middle">++number;</text>
<text x="78.028" y="91.341" text-anchor="middle">const auto digits =</text>
<text x="78.028" y="96.006" text-anchor="middle">static_cast&lt;std::size_t&gt;(</text>
<text x="78.028" y="100.672" text-anchor="middle">std::count_if(word.begin(),</text>
<text x="78.028" y="105.337" text-anchor="middle">word.end(), [](char ch) { return</text>
<text x="78.028" y="110.003" text-anchor="middle">ch &gt;= '<tspan font-family='Consolas'>0</tspan>' &amp;&amp; ch &lt;= '9'; }));</text>
<text x="78.028" y="127.006" text-anchor="middle">if (best.number == <tspan font-family='Consolas'>0</tspan> ||</text>
<text x="78.028" y="131.672" text-anchor="middle">digits &gt; best.digits)</text>
<text x="35.5" y="150.506" text-anchor="middle">best = {number, digits,</text>
<text x="35.5" y="155.172" text-anchor="middle">std::string(word)};</text>
