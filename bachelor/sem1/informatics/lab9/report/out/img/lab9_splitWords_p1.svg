<text x="53.028" y="9.339" text-anchor="middle">Начало</text>
<text x="51.228" y="17.339" text-anchor="end">{</text>
<text x="53.028" y="25.673" text-anchor="middle">std::vector&lt;std::string_view&gt; words;</text>
<text x="53.028" y="30.339" text-anchor="middle">std::size_t begin = <tspan font-family='Consolas'>0</tspan>;</text>
<text x="53.028" y="35.004" text-anchor="middle">std::size_t pos = <tspan font-family='Consolas'>0</tspan>;</text>
<text x="53.028" y="51.339" text-anchor="middle">while (pos &lt; line.size())</text>
<text x="53.028" y="67.506" text-anchor="middle">const auto separator =</text>
<text x="53.028" y="72.172" text-anchor="middle">separatorLength(line.substr(pos));</text>
<text x="53.028" y="88.339" text-anchor="middle">if (separator == <tspan font-family='Consolas'>0</tspan>)</text>
<text x="15.5" y="104.339" text-anchor="middle">++pos;</text>
<text x="90.557" y="104.339" text-anchor="middle">if (begin &lt; pos)</text>
<text x="58.028" y="120.506" text-anchor="middle">words.push_back(line.substr(</text>
<text x="58.028" y="125.172" text-anchor="middle">begin, pos - begin));</text>
<text x="61.557" y="101.539" text-anchor="end">1</text>
<text x="119.557" y="101.539" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="90.557" y="147.506" text-anchor="middle">pos += separator;</text>
<text x="90.557" y="152.172" text-anchor="middle">begin = pos;</text>
<text x="88.757" y="96.339" text-anchor="end">{</text>
<text x="88.757" y="160.339" text-anchor="end">}</text>
