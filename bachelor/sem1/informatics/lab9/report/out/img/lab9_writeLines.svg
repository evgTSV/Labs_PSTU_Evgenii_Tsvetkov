<text x="34.028" y="38.539" text-anchor="end">1</text>
<text x="67.028" y="38.539" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="50.528" y="89.339" text-anchor="middle">for (const std::string&amp; line : lines)</text>
<text x="50.528" y="105.339" text-anchor="middle">file &lt;&lt; line &lt;&lt; '\n';</text>
<text x="52.028" y="97.839" text-anchor="start">1</text>
<text x="84.528" y="86.539" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="50.528" y="130.339" text-anchor="middle">file.close();</text>
<text x="50.528" y="146.339" text-anchor="middle">if (!file)</text>
<text x="30.5" y="162.673" text-anchor="middle">throw std::runtime_error(</text>
<text x="30.5" y="167.339" text-anchor="middle">std::string(&quot;Cannot write: &quot;)</text>
