<text x="50.528" y="25.339" text-anchor="middle">std::ofstream file(path);</text>
<text x="50.528" y="41.339" text-anchor="middle">if (!file)</text>
<text x="30.5" y="57.673" text-anchor="middle">throw std::runtime_error(</text>
<text x="30.5" y="62.339" text-anchor="middle">std::string(&quot;Cannot write to:</text>
