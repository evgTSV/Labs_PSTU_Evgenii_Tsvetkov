<text x="81.228" y="17.339" text-anchor="end">{</text>
<text x="83.028" y="25.506" text-anchor="middle">std::cout &lt;&lt; &quot;Enter &quot; &lt;&lt;</text>
<text x="83.028" y="30.172" text-anchor="middle">count &lt;&lt; &quot; lines:\n&quot;;</text>
<text x="83.028" y="46.339" text-anchor="middle">std::vector&lt;std::string&gt; lines;</text>
<text x="83.028" y="62.339" text-anchor="middle">for (int i = <tspan font-family='Consolas'>0</tspan>; i &lt; count; ++i)</text>
<text x="83.028" y="78.339" text-anchor="middle">std::string line;</text>
<text x="83.028" y="96.839" text-anchor="middle">if (!std::getline(std::cin, line))</text>
<text x="40.5" y="115.506" text-anchor="middle">throw std::runtime_error(&quot;Not</text>
<text x="40.5" y="120.172" text-anchor="middle">enough input lines.&quot;);</text>
<text x="44.028" y="94.039" text-anchor="end">1</text>
<text x="122.028" y="94.039" text-anchor="start"><tspan font-family='Consolas'>0</tspan></text>
<text x="83.028" y="142.339" text-anchor="middle">lines.push_back(line);</text>
<text x="81.228" y="70.339" text-anchor="end">{</text>
